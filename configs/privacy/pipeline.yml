# Which backend runs the models, and which models it loads. Override it with --pipeline.
# Relative model paths are relative to the working directory (normally the project root).
# All settings are explained in docs/pipeline_config.md.
#
# The privacy profile blurs license plates and faces, e.g. in photos, dashcam or street footage.
#   license plates: https://huggingface.co/morsetechlab/yolov11-license-plate-detection (AGPL-3.0)
#   faces:          https://huggingface.co/AdamCodd/YOLOv11n-face-detection (Apache-2.0)
# Both come in larger, more accurate versions; change 'path' to use one.

# The implementation that runs the models and censors. Only read at startup.
#   python: pure Python, works out of the box (default)
#   cpp:    the C++ censor_core module, noticeably faster (mainly for live and video censoring).
#           It has to be installed separately, see docs/backends.md
# Both give the same results and use the same config files.
backend: python

# Where the models run: cpu | cuda | cuda:N (e.g. cuda:1 for the second GPU).
# Applies to every model; a model can override it with its own 'device'.
device: cpu

# ONNX Runtime CPU threads per model: a number, or auto (default: the CPU models split the cores).
# Only matters for models on the cpu. Set a number to leave cores free for other programs.
# threads: auto

# Number of worker threads that run the models. Only read at startup.
n_workers: 4

# The maximum number of jobs that can be active at any moment. Only read at startup.
# Limit this to reduce RAM usage.
# Keep >=n_workers, otherwise the workers have idle time
# Set to 0 for unlimited jobs.
max_concurrent_jobs: 128

models:
  #### License plates. This model has a dynamic input size.
  - name: license_plates
    path: models/license_plates/license-plate-finetune-v1n.onnx
    resize: rect
    # Input size: larger finds smaller (far away) plates but is slower: 640, 1280 (a multiple of 32).
    imgsz: 640
    labels: {License_Plate: license_plate}
    # Score floor: keep it at or below the lowest min_probability in your censor configs.
    min_confidence: 0.2

  #### Faces.
  - name: faces
    path: models/faces/yolov11n-face.onnx
    resize: letterbox            # this model has a fixed 640x640 input
    min_confidence: 0.2
